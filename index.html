<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ansura — Installment &amp; balance tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F0FA;
  --surface:#FFFFFF;
  --surface-2:#FAF9FF;
  --ink:#15162B;
  --muted:#7C7C99;
  --line:#EBE9F7;
  --violet:#6C4CF1;
  --violet-press:#5A3CD9;
  --violet-soft:#EFECFE;
  --violet-mid:#A794F6;
  --violet-pale:#CFC6FA;
  --panel:#191A2E;
  --panel-2:#22233C;
  --panel-ink:#F4F3FF;
  --panel-muted:#9A9ABC;
  --good:#1FBF8F;
  --warn:#F0A52A;
  --bad:#F0526A;
  --shadow:0 18px 40px -28px rgba(32,26,84,.55);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0D18;
    --surface:#16182A;
    --surface-2:#1B1D31;
    --ink:#F2F1FA;
    --muted:#9494B2;
    --line:#252742;
    --violet-soft:#241F45;
    --violet-pale:#4A3C8C;
    --panel:#12131F;
    --panel-2:#1D1F33;
    --shadow:0 18px 40px -28px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0D18;
  --surface:#16182A;
  --surface-2:#1B1D31;
  --ink:#F2F1FA;
  --muted:#9494B2;
  --line:#252742;
  --violet-soft:#241F45;
  --violet-pale:#4A3C8C;
  --panel:#12131F;
  --panel-2:#1D1F33;
  --shadow:0 18px 40px -28px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 64px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--surface);border-radius:999px;padding:10px 12px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding-left:6px}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,var(--violet),#8E6BFF);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:-.2px;line-height:1.1}
.brand span{display:block;font-size:11px;color:var(--muted)}
.nav{display:flex;gap:4px;background:var(--panel);border-radius:999px;padding:5px;margin-left:auto}
.nav button{color:var(--panel-muted);font-size:13px;font-weight:600;padding:8px 15px;border-radius:999px;transition:.18s}
.nav button[aria-selected="true"]{background:var(--violet);color:#fff}
.nav button:hover{color:#fff}
.tools{display:flex;gap:6px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;transition:.18s}
.icon-btn:hover{background:var(--violet-soft);border-color:var(--violet-pale)}
.sync{font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;padding-right:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.dot.local{background:var(--warn)} .dot.saving{background:var(--violet-mid)}

/* ---------- page head ---------- */
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:30px 4px 20px}
h1{font-size:clamp(30px,5.2vw,42px);line-height:1.02;letter-spacing:-1.4px;margin:0;font-weight:800}
.head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.head .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--violet);color:#fff;font-weight:700;
  font-size:14px;padding:12px 20px;border-radius:999px;box-shadow:0 12px 24px -14px var(--violet);transition:.18s}
.btn:hover{background:var(--violet-press)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--violet-soft)}
.btn.sm{padding:9px 15px;font-size:13px}

/* ---------- stat cards ---------- */
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));margin-bottom:14px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card .label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.card .big{font-size:26px;font-weight:800;letter-spacing:-1px;margin-top:12px;display:flex;align-items:baseline;gap:5px}
.card .big small{font-size:14px;font-weight:600;color:var(--muted)}
.trend{font-size:11.5px;font-weight:600;margin-top:5px;color:var(--muted)}
.trend.up{color:var(--bad)} .trend.down{color:var(--good)}
.pill-ico{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;background:var(--violet-soft);color:var(--violet)}
.pill-ico.red{background:#FDECEF;color:var(--bad)} .pill-ico.green{background:#E6F8F2;color:var(--good)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill-ico.red{background:#33202A}
  :root:not([data-theme="light"]) .pill-ico.green{background:#12332B}}
.mini{margin-top:14px;height:56px;width:100%;display:block}

.card.balance{background:linear-gradient(150deg,#1F1B3E 0%,#2A2359 45%,var(--violet) 130%);color:#fff}
.card.balance .label{color:#BCB2F5}
.card.balance .big small{color:#BCB2F5}
.safe{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;
  background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.safe div{font-size:11.5px;color:#C7BFF7;font-weight:600}
.safe b{display:block;font-size:16px;color:#fff;letter-spacing:-.4px}
.safe.tight b{color:#FFC2CC}
.balance-actions{display:flex;gap:8px;margin-top:12px}
.balance-actions button{flex:1;background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:700;
  padding:9px;border-radius:999px;transition:.18s}
.balance-actions button:hover{background:rgba(255,255,255,.26)}
.balance-actions button.solid{background:#fff;color:#2A2359}
.balance-actions button.solid:hover{background:#EDE9FF}

/* ---------- charts ---------- */
.charts{display:grid;gap:14px;grid-template-columns:1.25fr 1fr;margin-bottom:16px}
@media (max-width:880px){.charts{grid-template-columns:1fr}}
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.chart-head h2{font-size:15.5px;margin:0;letter-spacing:-.3px}
.chart-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:10px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.chart-svg{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.bar{transition:.2s}
.bar:hover{filter:brightness(1.08)}

/* ---------- filters ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 4px 14px}
.filters .count{background:var(--violet);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:9px 15px;font-size:13px;font-weight:600;color:var(--muted)}
.field select,.field input{border:0;background:none;outline:none;font-weight:600;font-size:13px;color:var(--ink);min-width:90px}
.field input::placeholder{color:var(--muted)}

/* ---------- dark panel ---------- */
.panel{background:var(--panel);border-radius:30px;padding:20px;color:var(--panel-ink)}
.panel-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.panel-top h2{font-size:16px;margin:0 auto 0 6px;letter-spacing:-.3px}
.seg{display:flex;gap:4px;background:#fff;border-radius:999px;padding:5px}
.seg button{font-size:12.5px;font-weight:700;color:#5C5C7A;padding:7px 14px;border-radius:999px;display:flex;align-items:center;gap:7px}
.seg button[aria-selected="true"]{background:var(--violet);color:#fff}
.seg .n{background:rgba(0,0,0,.08);border-radius:999px;font-size:10.5px;padding:1px 7px}
.seg button[aria-selected="true"] .n{background:rgba(255,255,255,.28)}
.panel-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px}
@media (max-width:880px){.panel-grid{grid-template-columns:1fr}}

.list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:4px}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:#3A3B57;border-radius:99px}
.row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--panel-2);
  border-radius:16px;padding:11px 13px;transition:.18s;border:1.5px solid transparent}
.row:hover{border-color:#43456B}
.row[aria-current="true"]{background:var(--violet);border-color:#8C74FF}
.row .av{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:15px;background:rgba(255,255,255,.12)}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who span{display:block;font-size:11px;color:var(--panel-muted)}
.row[aria-current="true"] .who span{color:#D8D0FF}
.tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:#D6D4F0}
.tag.due{background:#3A2E1B;color:#F5C071} .tag.over{background:#3E2029;color:#FF9AAB}
.tag.ok{background:#15382F;color:#55D8AC} .tag.done{background:#1F2B45;color:#8FB6FF}
.row .amt{font-size:13.5px;font-weight:800;white-space:nowrap}

.detail{background:linear-gradient(155deg,#4B36C4 0%,var(--violet) 55%,#8062FF 120%);border-radius:24px;padding:20px;color:#fff}
.detail .dtop{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;margin-bottom:18px}
@media (max-width:620px){.detail .dtop{grid-template-columns:1fr}}
.dtop .k{font-size:11.5px;color:#C9C0FF;font-weight:600;margin-bottom:6px}
.dtop .v{font-size:19px;font-weight:800;letter-spacing:-.5px}
.dtop .v small{display:block;font-size:11.5px;font-weight:600;color:#CFC7FF;letter-spacing:0;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px}
.tile{background:rgba(255,255,255,.13);border-radius:16px;padding:13px}
.tile b{display:block;font-size:17px;font-weight:800;letter-spacing:-.4px}
.tile span{font-size:11px;color:#CFC7FF;font-weight:600}
.tile.add{border:1.5px dashed rgba(255,255,255,.4);background:none;display:grid;place-items:center;min-height:78px;font-weight:700;font-size:13px}
.tile.add:hover{background:rgba(255,255,255,.1)}
.progress{height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:16px}
.progress i{display:block;height:100%;border-radius:99px;background:#fff}
.dfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.18)}
.dfoot .k{font-size:11px;color:#C9C0FF;font-weight:600}
.dfoot .v{font-size:15px;font-weight:800}
.dfoot .grow{flex:1}
.wbtn{background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:999px;transition:.18s}
.wbtn:hover{background:rgba(255,255,255,.3)}
.wbtn.solid{background:#fff;color:#4B36C4}
.wbtn.solid:hover{background:#EDE9FF}

.empty{text-align:center;padding:44px 20px;color:var(--panel-muted)}
.empty h3{color:#fff;margin:0 0 6px;font-size:18px}
.empty p{margin:0 auto 18px;max-width:340px;font-size:13.5px}

/* ---------- history + tips ---------- */
.lower{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:16px}
@media (max-width:880px){.lower{grid-template-columns:1fr}}
.hrow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.hrow:last-child{border:0}
.hrow .hi{width:32px;height:32px;border-radius:10px;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;font-size:14px;flex:none}
.hrow b{font-weight:700} .hrow span{color:var(--muted);font-size:11.5px;display:block}
.hrow .val{margin-left:auto;font-weight:800;white-space:nowrap}
.hrow .val.plus{color:var(--good)}
.tip{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.tip:last-child{border:0}
.tip .ti{font-size:17px;flex:none;width:30px}
.tip b{display:block;font-size:13.5px} .tip p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,16,42,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px;z-index:50}
.scrim[hidden]{display:none}
.modal{background:var(--surface);border-radius:26px;padding:22px;width:min(520px,100%);max-height:86vh;overflow:auto;box-shadow:0 40px 80px -30px rgba(20,14,60,.7)}
.modal h3{margin:0 0 4px;font-size:20px;letter-spacing:-.5px}
.modal .sub{margin:0 0 18px;font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.inp{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;font-size:14px;font-weight:600;outline:none;transition:.15s}
.inp:focus{border-color:var(--violet);background:var(--surface)}
.fld{margin-bottom:12px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.danger{color:var(--bad);font-weight:700;font-size:13px;margin-right:auto;padding:10px 4px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.switch{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;font-size:13px;font-weight:600}
.switch input{width:18px;height:18px;accent-color:var(--violet)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));
  background:var(--panel);color:#fff;font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:999px;z-index:60;box-shadow:0 20px 40px -20px #000}
.toast[hidden]{display:none}
.scroll-x{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <div class="mark">A</div>
      <div><b>Ansura</b><span>Installments, tracked honestly</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections">
      <button data-go="stats" aria-selected="true">Overview</button>
      <button data-go="panel">Installments</button>
      <button data-go="lower">Payments</button>
    </nav>
    <div class="tools">
      <span class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Saved</span></span>
      <button class="icon-btn" id="themeBtn" title="Switch light / dark">◐</button>
      <button class="icon-btn" id="exportBtn" title="Download a backup" hidden>↓</button>
    </div>
  </header>

  <div class="head">
    <div>
      <h1>Installments</h1>
      <p id="subhead">Every commitment, what it costs you this month, and when you're free of it.</p>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost sm" id="sampleBtn">Load sample data</button>
    <button class="btn" id="addBtn">+ Add installment</button>
  </div>

  <section class="stats" id="stats"></section>

  <section class="charts" id="charts"></section>

  <div class="filters">
    <div class="field"><span>Show</span>
      <select id="fStatus">
        <option value="all">All installments</option>
        <option value="active">Active only</option>
        <option value="unpaid">Unpaid this month</option>
        <option value="done">Settled</option>
      </select>
    </div>
    <div class="field"><span>Sort</span>
      <select id="fSort">
        <option value="due">By due date</option>
        <option value="amount">By monthly amount</option>
        <option value="left">By months left</option>
        <option value="name">By name</option>
      </select>
    </div>
    <div class="field" style="flex:1;min-width:180px">
      <input id="fSearch" placeholder="Search name or lender" aria-label="Search installments">
      <span>⌕</span>
    </div>
  </div>

  <section class="panel" id="panel">
    <div class="panel-top">
      <h2 id="panelTitle">Your commitments</h2>
      <div class="seg" id="seg"></div>
    </div>
    <div class="panel-grid">
      <div class="list" id="list"></div>
      <div id="detail"></div>
    </div>
  </section>

  <section class="lower" id="lower">
    <div class="card">
      <div class="chart-head"><div><h2>Payment history</h2><p>Recorded payments and balance top-ups.</p></div>
        <button class="btn ghost sm" id="fundBtn">+ Add funds</button></div>
      <div id="history"></div>
    </div>
    <div class="card">
      <div class="chart-head"><div><h2>What to do next</h2><p>Read from your own numbers.</p></div></div>
      <div id="tips"></div>
    </div>
  </section>
</div>

<div class="scrim" id="scrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
var LS="ansura.v1";
var CURRENCIES={RM:"MYR",$:"USD","S$":"SGD","€":"EUR",Rp:"IDR","£":"GBP"};
var ICONS=["\uD83D\uDE97","\uD83D\uDCF1","\uD83D\uDCBB","\uD83C\uDFE0","\uD83C\uDF93","\uD83D\uDECB\uFE0F","\uD83C\uDFCD\uFE0F","\uD83D\uDCB3","\u2708\uFE0F","\uD83E\uDDB7"];

var state=blank(), docRef=null, saveTimer=null, cloudOn=false;

function blank(){
  return {v:1,currency:"RM",balance:0,autoDeduct:true,items:[],history:[],selected:null,updated:0,theme:null};
}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function money(n){
  var code=CURRENCIES[state.currency]||"MYR";
  try{return new Intl.NumberFormat(undefined,{style:"currency",currency:code,maximumFractionDigits:2}).format(n||0)}
  catch(e){return state.currency+" "+(n||0).toFixed(2)}
}
function shortMoney(n){
  var a=Math.abs(n);
  if(a>=1e6)return (n/1e6).toFixed(1)+"M";
  if(a>=1e3)return Math.round(n/1e3)+"k";
  return Math.round(n);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function monthKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function monthLabel(off){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);
  return d.toLocaleDateString(undefined,{month:"short"})}
function monthFull(off){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);
  return d.toLocaleDateString(undefined,{month:"long",year:"numeric"})}

/* ---------------- derived ---------------- */
function left(it){return Math.max(0,(it.months|0)-(it.paid|0))}
function remainingOf(it){return left(it)*(+it.monthly||0)}
function totalOf(it){return (it.months|0)*(+it.monthly||0)}
function paidThisMonth(it){
  var k=monthKey();
  return state.history.some(function(h){return h.itemId===it.id&&h.type==="pay"&&h.month===k});
}
function statusOf(it){
  if(left(it)<=0)return {key:"done",label:"Settled",cls:"done"};
  if(paidThisMonth(it))return {key:"ok",label:"Paid",cls:"ok"};
  var today=new Date().getDate();
  if(today>(it.dueDay|0))return {key:"over",label:"Overdue",cls:"over"};
  return {key:"due",label:"Due "+ordinal(it.dueDay),cls:"due"};
}
function ordinal(n){n=n|0;var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function daysUntilDue(it){
  var now=new Date(),d=new Date(now.getFullYear(),now.getMonth(),it.dueDay|0);
  if(paidThisMonth(it)||d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))
    d=new Date(now.getFullYear(),now.getMonth()+1,it.dueDay|0);
  return Math.round((d-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
}
function active(){return state.items.filter(function(i){return left(i)>0})}
function monthlyLoad(){return active().reduce(function(a,i){return a+(+i.monthly||0)},0)}
function outstanding(){return state.items.reduce(function(a,i){return a+remainingOf(i)},0)}
function dueLeftThisMonth(){
  return active().filter(function(i){return !paidThisMonth(i)}).reduce(function(a,i){return a+(+i.monthly||0)},0)}
function freeIn(){return active().reduce(function(m,i){return Math.max(m,left(i))},0)}
function scheduleSeries(n){
  var out=[];
  for(var k=0;k<n;k++){
    var s=0;
    active().forEach(function(i){if(k<left(i))s+=(+i.monthly||0)});
    out.push(s);
  }
  return out;
}
function balanceSeries(n){
  var out=[],total=outstanding(),sched=scheduleSeries(n);
  for(var k=0;k<n;k++){total-=sched[k];out.push(Math.max(0,total))}
  return out;
}

/* ---------------- persistence ---------------- */
function setSync(kind,txt){
  var d=document.getElementById("syncDot"),t=document.getElementById("syncTxt");
  d.className="dot"+(kind==="local"?" local":kind==="saving"?" saving":"");
  t.textContent=txt;
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function loadLocal(){try{var r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function persist(){
  state.updated=Date.now();
  saveLocal();
  if(!docRef){setSync("local","Saved on this device");return}
  setSync("saving","Saving…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    docRef.set({state:JSON.parse(JSON.stringify(state))}).then(function(){
      setSync("cloud","Saved to your account");
    },function(){setSync("local","Saved on this device")});
  },500);
}
function initCloud(){
  if(typeof window.claude==="undefined"||!window.claude.use){setSync("local","Saved on this device");return}
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];
    if(!db){setSync("local","Saved on this device");return}
    var p=user?user.id():Promise.resolve(null);
    return Promise.resolve(p).then(function(id){
      docRef=id?db.doc("data/users/"+id+"/finance"):db.doc("app/finance");
      cloudOn=true;
      return docRef.get().then(function(snap){
        var d=snap&&snap.exists?snap.data():null;
        var remote=d&&d.state;
        if(remote&&(!state.updated||(remote.updated||0)>state.updated)){
          state=migrate(remote);render();
        }else if(state.items.length||state.balance){persist()}
        setSync("cloud","Saved to your account");
      });
    });
  }).catch(function(){setSync("local","Saved on this device")});
}
function migrate(s){
  var b=blank();
  for(var k in b)if(!(k in s))s[k]=b[k];
  s.items=(s.items||[]).map(function(i){
    i.monthly=+i.monthly||0;i.months=i.months|0;i.paid=Math.min(i.paid|0,i.months);
    i.dueDay=Math.min(28,Math.max(1,i.dueDay|0||1));return i});
  s.history=s.history||[];
  return s;
}
function downloadBackup(){
  var data=JSON.stringify(state,null,2);
  if(typeof window.claude!=="undefined"&&window.claude.use){
    window.claude.use("downloads").then(function(d){
      if(!d)return fallbackDownload(data);
      d.save({filename:"ansura-backup-"+monthKey()+".json",data:data}).catch(function(){});
    }).catch(function(){fallbackDownload(data)});
  }else fallbackDownload(data);
}
function fallbackDownload(data){
  try{
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    a.download="ansura-backup.json";a.click();
  }catch(e){toast("Backup unavailable here")}
}

/* ---------------- charts ---------------- */
function barChart(values,highlight){
  var W=520,H=190,pad=26,n=values.length,max=Math.max.apply(null,values.concat([1]));
  var gap=8,bw=(W-pad*2-gap*(n-1))/n,s="";
  for(var i=0;i<n;i++){
    var h=Math.max(3,(values[i]/max)*(H-52));
    var x=pad+i*(bw+gap), y=H-30-h;
    var fill=i===0?"var(--violet)":(i<3?"var(--violet-mid)":"var(--violet-pale)");
    s+='<g><title>'+monthFull(i)+": "+money(values[i])+'</title>'+
       '<rect class="bar" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+
       '" rx="'+Math.min(7,bw/2).toFixed(1)+'" fill="'+fill+'"/>'+
       '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">'+monthLabel(i)+'</text></g>';
    if(i===0)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-7).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)">'+shortMoney(values[i])+'</text>';
  }
  return '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Payments due each month">'+s+'</svg>';
}
function lineChart(values){
  var W=460,H=190,pad=30,n=values.length;
  if(n<2)return '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'"></svg>';
  var max=Math.max.apply(null,values.concat([1]));
  var px=function(i){return pad+i*((W-pad*2)/(n-1))};
  var py=function(v){return H-34-(v/max)*(H-58)};
  var pts=values.map(function(v,i){return px(i).toFixed(1)+","+py(v).toFixed(1)}).join(" ");
  var area="M"+px(0).toFixed(1)+","+(H-34)+" L"+pts.split(" ").join(" L")+" L"+px(n-1).toFixed(1)+","+(H-34)+" Z";
  var s='<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="var(--violet)" stop-opacity=".28"/>'+
        '<stop offset="100%" stop-color="var(--violet)" stop-opacity="0"/></linearGradient></defs>';
  for(var g=0;g<3;g++){var yy=(H-34)-g*((H-58)/2);
    s+='<line x1="'+pad+'" y1="'+yy.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+yy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'}
  s+='<path d="'+area+'" fill="url(#lg)"/>';
  s+='<polyline points="'+pts+'" fill="none" stroke="var(--violet)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  for(var i=0;i<n;i++){
    if(n>14&&i%2)continue;
    s+='<g><title>End of '+monthFull(i)+": "+money(values[i])+'</title>'+
       '<circle cx="'+px(i).toFixed(1)+'" cy="'+py(values[i]).toFixed(1)+'" r="3.6" fill="var(--surface)" stroke="var(--violet)" stroke-width="2.2"/></g>';
  }
  for(var j=0;j<n;j+=Math.max(1,Math.ceil(n/6))){
    s+='<text x="'+px(j).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">'+monthLabel(j)+'</text>';
  }
  return '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Projected remaining debt">'+s+'</svg>';
}
function sparkBars(values){
  var W=200,H=56,n=values.length,max=Math.max.apply(null,values.concat([1])),bw=(W-(n-1)*5)/n,s="";
  for(var i=0;i<n;i++){var h=Math.max(3,(values[i]/max)*H);
    s+='<rect x="'+(i*(bw+5)).toFixed(1)+'" y="'+(H-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+
       '" rx="4" fill="'+(i===0?"var(--violet)":"var(--violet-pale)")+'"/>'}
  return '<svg class="mini" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+s+'</svg>';
}
function sparkLine(values){
  var W=200,H=56,n=values.length;
  if(n<2)return '<svg class="mini" viewBox="0 0 200 56"></svg>';
  var max=Math.max.apply(null,values.concat([1]));
  var pts=values.map(function(v,i){return (i*(W/(n-1))).toFixed(1)+","+(H-4-(v/max)*(H-10)).toFixed(1)}).join(" ");
  return '<svg class="mini" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<polyline points="'+pts+'" fill="none" stroke="var(--violet)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function stackBar(){
  var items=active().slice().sort(function(a,b){return remainingOf(b)-remainingOf(a)}).slice(0,6);
  var tot=items.reduce(function(a,i){return a+remainingOf(i)},0)||1,x=0,s="";
  var cols=["var(--violet)","#8467F5","var(--violet-mid)","#BFB1F8","var(--violet-pale)","#E2DCFC"];
  items.forEach(function(i,k){
    var w=(remainingOf(i)/tot)*196;
    s+='<g><title>'+esc(i.name)+": "+money(remainingOf(i))+'</title><rect x="'+x.toFixed(1)+'" y="18" width="'+Math.max(2,w-3).toFixed(1)+
       '" height="20" rx="6" fill="'+cols[k%6]+'"/></g>';x+=w;
  });
  return '<svg class="mini" viewBox="0 0 200 56" preserveAspectRatio="none" aria-hidden="true">'+s+'</svg>';
}

function filtered(){
  var f=document.getElementById("fStatus").value,
      q=document.getElementById("fSearch").value.trim().toLowerCase(),
      sort=document.getElementById("fSort").value;
  var list=state.items.filter(function(i){
    if(f==="active"&&left(i)<=0)return false;
    if(f==="done"&&left(i)>0)return false;
    if(f==="unpaid"&&(left(i)<=0||paidThisMonth(i)))return false;
    if(q&&(i.name+" "+(i.lender||"")).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  list.sort(function(a,b){
    if(sort==="amount")return b.monthly-a.monthly;
    if(sort==="left")return left(a)-left(b);
    if(sort==="name")return a.name.localeCompare(b.name);
    return daysUntilDue(a)-daysUntilDue(b);
  });
  return list;
}

      '<small>'+(left(sel)?(d===0?"Today":"in "+d+" day"+(d===1?"":"s")):"Fully settled")+'</small></div></div>'+

function renderLower(){
  var h=state.history.slice().sort(function(a,b){return b.at-a.at}).slice(0,8);
  document.getElementById("history").innerHTML= h.length? h.map(function(x){
    return '<div class="hrow"><span class="hi">'+(x.type==="fund"?"\u2191":"\u2193")+'</span>'+
      '<div><b>'+esc(x.name)+'</b><span>'+new Date(x.at).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})+'</span></div>'+
      '<span class="val'+(x.type==="fund"?" plus":"")+'">'+(x.type==="fund"?"+":"\u2212")+money(x.amount).replace("-","")+'</span></div>';
  }).join("") : '<p style="color:var(--muted);font-size:13.5px;margin:10px 0">No payments recorded yet. When you record one, it lands here and adjusts your balance.</p>';

  var tips=[],load=monthlyLoad(),safe=state.balance-dueLeftThisMonth();
  var soonest=active().slice().sort(function(a,b){return left(a)-left(b)})[0];
  var biggest=active().slice().sort(function(a,b){return b.monthly-a.monthly})[0];
  if(safe<0)tips.push(["\u26A0\uFE0F","You're short this month","Your balance covers "+money(state.balance)+" of the "+money(dueLeftThisMonth())+" still due. Top up "+money(-safe)+" before the earliest due date."]);
  else if(state.items.length)tips.push(["\u2705","This month is covered","After every remaining payment you'd still hold "+money(safe)+"."]);
  if(soonest)tips.push(["\uD83C\uDFC1","Nearest finish line",esc(soonest.name)+" ends in "+left(soonest)+" month"+(left(soonest)===1?"":"s")+". Clearing it frees "+money(soonest.monthly)+" a month."]);
  if(biggest&&active().length>1)tips.push(["\uD83E\uDDF1","Heaviest commitment",esc(biggest.name)+" takes "+Math.round((biggest.monthly/load)*100)+"% of your monthly installment load."]);
  var overdue=active().filter(function(i){return statusOf(i).key==="over"});
  if(overdue.length)tips.push(["\u23F0",overdue.length+" payment"+(overdue.length===1?"":"s")+" past the due day",overdue.map(function(i){return esc(i.name)}).join(", ")+" — record the payment if you've already paid."]);
  if(!state.items.length)tips.push(["\uD83D\uDCA1","Start with one","Add the installment you think about most. The rest is easier once you can see it."]);
  document.getElementById("tips").innerHTML=tips.map(function(t){
    return '<div class="tip"><span class="ti">'+t[0]+'</span><div><b>'+t[1]+'</b><p>'+t[2]+'</p></div></div>'}).join("");
}

  '<div class="grid2"><div class="fld"><label for="mPaid">Payments already made</label><input class="inp" id="mPaid" type="number" min="0" value="'+(e.paid|0)+'"></div>'+
  '<div class="fld"><label for="mDue">Due day of month</label><input class="inp" id="mDue" type="number" min="1" max="28" value="'+(e.dueDay||1)+'"></div></div>'+
  '<div class="fld"><label>Icon</label><div class="chips" id="mIcons">'+ICONS.map(function(ic){
    return '<button type="button" class="chip" data-ic="'+ic+'" aria-pressed="'+(ic===e.icon)+'">'+ic+'</button>'}).join("")+'</div></div>'+
  '<div class="modal-foot">'+(it?'<button class="danger" data-act="delete">Delete this installment</button>':"")+
    '<button class="btn ghost" data-act="close">Cancel</button>'+
    '<button class="btn" data-act="save" data-id="'+(it?it.id:"")+'">'+(it?"Save changes":"Add installment")+'</button></div>';
}
function saveItem(id){
  var g=function(x){return document.getElementById(x)};
  var name=g("mName").value.trim();
  var monthly=parseFloat(g("mAmt").value),months=parseInt(g("mMonths").value,10);
  if(!name||!(monthly>0)||!(months>0)){toast("Name, monthly amount and months are required");return}
  var ic=document.querySelector('#mIcons [aria-pressed="true"]');
  var data={name:name,lender:g("mLender").value.trim(),category:g("mCat").value,
    monthly:monthly,months:months,paid:Math.min(months,Math.max(0,parseInt(g("mPaid").value,10)||0)),
    dueDay:Math.min(28,Math.max(1,parseInt(g("mDue").value,10)||1)),icon:ic?ic.dataset.ic:"\uD83D\uDCB3"};
  if(id){
    state.items.forEach(function(i){if(i.id===id)Object.assign(i,data)});
    toast("Installment updated");
  }else{
    data.id=uid();data.created=Date.now();state.items.push(data);state.selected=data.id;
    toast("Installment added");
  }
  persist();closeModal();render();
}
function recordPayment(it){
  if(left(it)<=0)return;
  it.paid=(it.paid|0)+1;
  if(state.autoDeduct)state.balance-=(+it.monthly||0);
  state.history.push({id:uid(),type:"pay",itemId:it.id,name:it.name+" payment "+it.paid+"/"+it.months,
    amount:+it.monthly||0,at:Date.now(),month:monthKey()});
  persist();render();
  toast(left(it)?"Payment recorded":it.name+" is fully settled \uD83C\uDF89");
}
function undoLast(it){
  for(var i=state.history.length-1;i>=0;i--){
    if(state.history[i].itemId===it.id&&state.history[i].type==="pay"){
      if(state.autoDeduct)state.balance+=state.history[i].amount;
      state.history.splice(i,1);it.paid=Math.max(0,(it.paid|0)-1);
      persist();render();toast("Last payment undone");return;
    }
  }
  it.paid=Math.max(0,(it.paid|0)-1);persist();render();
}
function balanceModal(mode){
  var isFund=mode==="fund";
  openModal('<h3>'+(isFund?"Add funds":"Set your balance")+'</h3>'+
    '<p class="sub">'+(isFund?"Salary, transfer, refund — anything that increases what you hold.":"Type what your account actually shows right now.")+'</p>'+
    '<div class="grid2"><div class="fld"><label for="bAmt">Amount</label>'+
      '<input class="inp" id="bAmt" type="number" step="0.01" value="'+(isFund?"":state.balance)+'" placeholder="0.00"></div>'+
    '<div class="fld"><label for="bCur">Currency</label><select class="inp" id="bCur">'+
      Object.keys(CURRENCIES).map(function(c){return '<option'+(c===state.currency?" selected":"")+'>'+c+'</option>'}).join("")+
      '</select></div></div>'+
    (isFund?'<div class="fld"><label for="bNote">Note</label><input class="inp" id="bNote" placeholder="September salary"></div>':"")+
    '<div class="fld"><label class="switch"><input type="checkbox" id="bAuto"'+(state.autoDeduct?" checked":"")+
      '> Deduct recorded payments from my balance automatically</label></div>'+
    '<div class="modal-foot"><button class="btn ghost" data-act="close">Cancel</button>'+
    '<button class="btn" data-act="'+(isFund?"savefund":"savebal")+'">'+(isFund?"Add funds":"Save balance")+'</button></div>');
}
function saveBalance(fund){
  var v=parseFloat(document.getElementById("bAmt").value);
  state.currency=document.getElementById("bCur").value;
  state.autoDeduct=document.getElementById("bAuto").checked;
  if(isNaN(v)){toast("Enter an amount");return}
  if(fund){
    state.balance+=v;
    var note=(document.getElementById("bNote").value||"").trim()||"Funds added";
    state.history.push({id:uid(),type:"fund",name:note,amount:v,at:Date.now(),month:monthKey()});
  }else state.balance=v;
  persist();closeModal();render();toast(fund?"Funds added":"Balance saved");
}
function sampleData(){
  var mk=function(n,l,c,m,mo,p,d,ic){return {id:uid(),name:n,lender:l,category:c,monthly:m,months:mo,paid:p,dueDay:d,icon:ic,created:Date.now()}};
  state.items=[
    mk("Myvi car loan","Maybank","Vehicle",680,60,23,5,"\uD83D\uDE97"),
    mk("iPhone instalment","Celcom","Electronics",145,24,9,12,"\uD83D\uDCF1"),
    mk("MacBook Air 0%","Shopee PayLater","Electronics",320,12,4,20,"\uD83D\uDCBB"),
    mk("Sofa set","Courts","Home",89,18,15,8,"\uD83D\uDECB\uFE0F"),
    mk("Study loan","PTPTN","Education",210,84,31,28,"\uD83C\uDF93")
  ];
  state.balance=4250;state.selected=state.items[0].id;
  state.history=[{id:uid(),type:"fund",name:"Opening balance",amount:4250,at:Date.now()-864e5*3,month:monthKey()}];
  persist();render();toast("Sample data loaded — edit or delete anything");
}

/* ---------------- events ---------------- */
document.addEventListener("click",function(ev){
  var row=ev.target.closest(".row[data-id]");
  if(row){state.selected=row.dataset.id;persist();renderPanel();return}
  var seg=ev.target.closest("#seg button");
  if(seg){document.getElementById("fStatus").value=seg.dataset.f;renderPanel();return}
  var nav=ev.target.closest("#nav button");
  if(nav){
    Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(b){b.setAttribute("aria-selected",b===nav)});
    var t=document.getElementById(nav.dataset.go);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});return;
  }
  var chip=ev.target.closest("#mIcons .chip");
  if(chip){Array.prototype.forEach.call(document.querySelectorAll("#mIcons .chip"),function(b){b.setAttribute("aria-pressed",b===chip)});return}
  var a=ev.target.closest("[data-act]");
  if(!a){
    if(ev.target.id==="scrim")closeModal();
    return;
  }
  var sel=state.items.filter(function(i){return i.id===state.selected})[0];
  switch(a.dataset.act){
    case "add": openModal(itemForm(null));break;
    case "edit": if(sel)openModal(itemForm(sel));break;
    case "save": saveItem(a.dataset.id);break;
    case "delete":
      if(sel){state.items=state.items.filter(function(i){return i.id!==sel.id});
        state.history=state.history.filter(function(h){return h.itemId!==sel.id});
        state.selected=state.items[0]?state.items[0].id:null;persist();closeModal();render();toast("Installment deleted")}
      break;
    case "pay": if(sel)recordPayment(sel);break;
    case "undo": if(sel)undoLast(sel);break;
    case "setbal": balanceModal("set");break;
    case "fund": balanceModal("fund");break;
    case "savebal": saveBalance(false);break;
    case "savefund": saveBalance(true);break;
    case "sample": sampleData();break;
    case "close": closeModal();break;
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape")closeModal();
  if(e.key==="Enter"&&document.getElementById("modal").contains(e.target)&&e.target.tagName==="INPUT"){
    var b=document.querySelector('#modal [data-act="save"],#modal [data-act="savebal"],#modal [data-act="savefund"]');
    if(b)b.click();
  }
});
document.getElementById("addBtn").onclick=function(){openModal(itemForm(null))};
document.getElementById("sampleBtn").onclick=sampleData;
document.getElementById("fundBtn").onclick=function(){balanceModal("fund")};
document.getElementById("fStatus").onchange=renderPanel;
document.getElementById("fSort").onchange=renderPanel;
document.getElementById("fSearch").oninput=renderPanel;
document.getElementById("exportBtn").onclick=downloadBackup;
document.getElementById("themeBtn").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next=cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",next);state.theme=next;persist();
};

/* ---------------- boot ---------------- */
var local=loadLocal();
if(local)state=migrate(local);
if(state.theme)document.documentElement.setAttribute("data-theme",state.theme);
render();
setSync("local","Saved on this device");
initCloud();
if(typeof window.claude!=="undefined"&&window.claude.use){
  window.claude.use("downloads").then(function(d){if(d)document.getElementById("exportBtn").hidden=false}).catch(function(){});
}
})();
</script>
</body>
</html>
